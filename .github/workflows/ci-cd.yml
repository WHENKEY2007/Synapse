name: Synapse CI/CD Enterprise Pipeline

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. CODE QUALITY & LINTING
  # ============================================================================
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linter
        run: |
          ruff check backend/ --ignore E501

      - name: Validate JSON & YAML Files
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('**/*.json', recursive=True) if 'node_modules' not in f]"

  # ============================================================================
  # 2. AUTOMATED TEST SUITE & COVERAGE
  # ============================================================================
  test-suite:
    name: Pytest Automated Verification (17 Scenarios)
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Execute Full Test Suite
        env:
          SYNAPSE_ENV: test
          SYNAPSE_JWT_SECRET: test-secret-key-ci-cd-pipeline-2026
        run: |
          pytest backend/ -v --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # 3. SECURITY & VULNERABILITY AUDITING
  # ============================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners
        run: |
          pip install bandit

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r backend/ -ll -ii -x backend/test_*.py

  # ============================================================================
  # 4. CONTAINER BUILD & HEALTHCHECK SMOKE TEST
  # ============================================================================
  container-build:
    name: Docker Multi-Stage Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test-suite, security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Synapse Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: synapse-knowledge-base:${{ github.sha }}
          load: true

      - name: Launch Container Smoke Test
        run: |
          docker run -d --name synapse-test -p 8000:8000 synapse-knowledge-base:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/api/health || exit 1
          docker stop synapse-test && docker rm synapse-test

  # ============================================================================
  # 5. CONTINUOUS DEPLOYMENT (STAGING / PROD)
  # ============================================================================
  deploy:
    name: Deploy to Cloud Infrastructure
    runs-on: ubuntu-latest
    needs: [container-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Notification
        run: |
          echo "All 17 verification tests, security scans, and container builds succeeded."
          echo "Deploying Synapse release ${{ github.sha }} to Target Cloud Environment."
